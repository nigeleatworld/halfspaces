<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BAH! The Bus Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; overflow: hidden;
    font-family: "Comic Sans MS", "Chalkboard SE", "Baloo", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  #game {
    position: relative; width: 100vw;
    height: 100vh; height: 100dvh;   /* dvh: mobile Safari's address bar can't shift the layout */
    /* muted backdrop: only the actors carry saturated colour (grey first, colour second) */
    background: linear-gradient(#9dc3d8 0%, #c2d8e4 18%, #dae6ec 30%);
    overflow: hidden;
  }

  /* Sun (softened; sky band is shallower now that there are two roads) */
  .sun {
    position: absolute; top: 2.5vh; right: 8vw;
    width: 11vmin; height: 11vmin; border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #fdf0c0, #f2cf6b);
    box-shadow: 0 0 4.5vmin #f6e3a1; animation: sunPulse 4s ease-in-out infinite;
  }
  @keyframes sunPulse { 50% { transform: scale(1.06); } }

  /* Clouds */
  .cloud {
    position: absolute; font-size: 10vmin; opacity: .95;
    animation: drift linear infinite;
  }
  @keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }

  /* Time of day: a random sky per session (all kept muted + light; no dark night = no eye strain) */
  #game.morning { background: linear-gradient(#e7d2c6 0%, #ecdcd2 18%, #e6e2da 30%); }
  #game.noon    { background: linear-gradient(#9dc3d8 0%, #c2d8e4 18%, #dae6ec 30%); }
  #game.evening { background: linear-gradient(#b3a3c0 0%, #d3bdbc 20%, #e0d2c9 32%); }
  #game.morning .sun { background: radial-gradient(circle at 40% 40%, #fdeacf, #f2c98a); box-shadow: 0 0 4.5vmin #f6dcae; }
  #game.evening .sun { right: 16vw; top: 5vh; background: radial-gradient(circle at 40% 40%, #ffd7ac, #ef9f5c); box-shadow: 0 0 5vmin #f4b878; }
  #game.evening .cloud, #game.morning .cloud { opacity: .75; }

  /* Rain: dozens of discrete streaks that actually FALL (built in JS), + a soft overcast tint.
     Two depth layers (near/far). Kept gentle on the eyes; density/opacity are modest. */
  #rain { position: absolute; inset: 0; z-index: 30; pointer-events: none; overflow: hidden;
          opacity: 0; transition: opacity 1.4s ease;
          background: linear-gradient(rgba(122,140,160,.13), rgba(122,140,160,.05)); }
  body.rain #rain { opacity: 1; }
  #rain .drop {
    position: absolute; top: 0; width: 0.22vh; border-radius: 0.3vh;
    background: linear-gradient(rgba(216,231,244,0), rgba(216,231,244,.62));
    will-change: transform; animation: dropFall linear infinite;
  }
  #rain .drop.far {
    width: 0.15vh; background: linear-gradient(rgba(216,231,244,0), rgba(216,231,244,.34));
  }
  @keyframes dropFall {
    from { transform: translateY(-16vh) rotate(13deg); }
    to   { transform: translateY(118vh) rotate(13deg); }
  }

  /* --- Vertical composition (bottom -> top), deliberate proportions ---
     grass stage 0-30 | near road 30-46 | verge 46-48 | far road 48-60 |
     embankment 60-70 | viaduct deck ~70 (pillars into embankment) + train | sky 70-100 */
  .grass { position: absolute; bottom: 0; left: 0; width: 100%; height: 30vh; background: linear-gradient(#8fbf6f, #79ab5c); }
  .road  { position: absolute; bottom: 30vh; left: 0; width: 100%; height: 16vh; background: #63636d; box-shadow: 0 -0.6vh 0 #4a4a53 inset, 0 0.6vh 0 #4a4a53 inset; }
  .road::before, .road::after { content:""; position:absolute; left:0; width:100%; height:1.4vh; background:#e8e8ee; }
  .road::before { top: 1.6vh; opacity:.4; }
  .road::after {
    top: 55%; transform: translateY(-50%);
    background: repeating-linear-gradient(90deg, #e3d489 0 7vw, transparent 7vw 14vw);
    height: 1.8vh;
  }
  .verge { position: absolute; bottom: 46vh; left: 0; width: 100%; height: 2vh; background: #84b268; }
  .roadFar { position: absolute; bottom: 48vh; left: 0; width: 100%; height: 12vh; background: #6a6a73; box-shadow: 0 -0.4vh 0 #52525b inset, 0 0.4vh 0 #52525b inset; }
  .roadFar::after {
    content:""; position:absolute; left:0; width:100%; height:1vh;
    top: 50%; transform: translateY(-50%);
    background: repeating-linear-gradient(90deg, #d9cd8a 0 5vw, transparent 5vw 10vw);
  }
  /* Green embankment the viaduct stands on (gives the pillars a base + depth) */
  .embankment { position: absolute; bottom: 60vh; left: 0; width: 100%; height: 10vh; background: linear-gradient(#7ea862, #6d9853); box-shadow: 0 0.5vh 0 rgba(0,0,0,.06) inset; z-index: 2; }
  /* Elevated MRT viaduct: deck + regularly-spaced pillars rooted in the embankment */
  .viaduct { position: absolute; bottom: 69.5vh; left: 0; width: 100%; height: 2.6vh; background: linear-gradient(#cfd3db, #b4b8c1); box-shadow: 0 0.5vh 0 #9a9ea7 inset; z-index: 3; }
  .viaduct::before {  /* pillars: a repeating column pattern hanging below the deck */
    content:""; position:absolute; bottom:-9.5vh; left:0; width:100%; height:9.5vh;
    background: repeating-linear-gradient(90deg, transparent 0 15vw, #b6bac2 15vw 17.5vw, transparent 17.5vw 30vw);
    z-index:-1;
  }
  .viaduct::after {  /* rail lip on top of the deck */
    content:""; position:absolute; top:-0.7vh; left:0; width:100%; height:0.7vh;
    background: repeating-linear-gradient(90deg, #a9adb6 0 1vw, transparent 1vw 6vw);
  }

  /* Bus stop: stands on the far sidewalk; its sign wiggles + glows when a bus is coming */
  #busStop {
    position: absolute; bottom: 46vh; left: 20vw; width: 7.5vmin; z-index: 7;
    transform-origin: 50% 100%;
    filter: drop-shadow(0 0.6vh 0.3vh rgba(0,0,0,.18));
  }
  #busStop svg { width: 100%; height: auto; display: block; }
  #busStop.incoming {
    animation: signWiggle .4s ease-in-out infinite;
    filter: drop-shadow(0 0 2vmin #ffe14d);
  }
  @keyframes signWiggle { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }

  /* Moving characters (near vehicles ride the near road at 30-46vh) */
  .actor {
    position: absolute; bottom: 31vh; font-size: 19vmin; z-index: 10;
    line-height: 1; will-change: transform; white-space: nowrap;
    filter: drop-shadow(0 1vh 0.4vh rgba(0,0,0,.18));
  }
  .actor.bus { bottom: 30vh; z-index: 14; }
  .actor.bus svg { width: 44vmin; height: auto; display: block; }
  .actor.animal svg { width: 28vmin; height: auto; display: block; }   /* the full-body lion */
  /* animals walk on the GRASS stage, not the road ("animals don't walk on roads") */
  .actor.animal { bottom: 13vh; font-size: 19vmin; z-index: 20; }
  /* lion + croc + elephant: bigger AND always drawn in front, so if it makes a sound you can see it */
  .actor.big { font-size: 23vmin; z-index: 26; }
  /* baby elephant trailing its mama in the parade */
  .actor.baby { font-size: 12vmin; z-index: 26; }
  /* far lane: smaller + behind for depth; travels left -> right so actors get flipped in JS */
  .actor.far { bottom: 49vh; font-size: 12vmin; z-index: 4; }
  /* far-lane animals walk the green embankment under the viaduct */
  .actor.far.animal { bottom: 61vh; font-size: 12vmin; z-index: 4; }
  .actor.far.animal svg { width: 17vmin; }
  .actor.far.big { font-size: 13vmin; z-index: 5; }
  .actor.far.baby { font-size: 7vmin; z-index: 5; }
  /* papa + mama stroll the front of the grass stage, nearest the viewer */
  .actor.person { bottom: 1.5vh; z-index: 28; }
  .actor.person svg { width: 24vmin; height: auto; display: block; }
  /* MRT train rides the elevated viaduct, now comfortably in the upper third */
  .actor.train { bottom: 71vh; z-index: 8; }
  .actor.train svg { width: 60vmin; height: auto; display: block; }
  /* Police car: gentle alternating red/blue glow (soft, slow — not a harsh strobe) */
  .actor.siren { animation: sirenFlash 1s steps(1, end) infinite; }
  @keyframes sirenFlash {
    0%,49%   { filter: drop-shadow(0 1vh 0.4vh rgba(0,0,0,.18)) drop-shadow(0 -1vh 2.4vmin rgba(255,70,70,.55)); }
    50%,100% { filter: drop-shadow(0 1vh 0.4vh rgba(0,0,0,.18)) drop-shadow(0 -1vh 2.4vmin rgba(70,110,255,.55)); }
  }

  /* Control dock: the hero BUS button flanked by smaller summon buttons (one tidy cluster) */
  #dock {
    position: absolute; left: 50%; bottom: calc(2.5vh + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    display: flex; align-items: flex-end; gap: 3.2vw; z-index: 40;
  }
  /* Hero: catch the bus (the one timing game) */
  #tapBtn {
    width: 26vmin; height: 26vmin; border-radius: 50%; border: none;
    background: radial-gradient(circle at 38% 32%, #ff8fae, #ff4d79);
    box-shadow: 0 1.2vh 0 #c9315a, 0 1.8vh 3vh rgba(0,0,0,.25);
    color: #fff; font-size: 5.4vmin; font-weight: 900; letter-spacing: .05em;
    font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    text-shadow: 0 0.3vh 0 rgba(0,0,0,.2);
    transition: transform .06s ease, box-shadow .06s ease;
  }
  #tapBtn:active { transform: translateY(1vh); box-shadow: 0 0.3vh 0 #c9315a; }
  #tapBtn.busready {
    background: radial-gradient(circle at 38% 32%, #7dffb0, #17c964);
    box-shadow: 0 1.2vh 0 #0e8a44, 0 0 5vmin 1vmin #7dffb0;
    animation: btnGlow .6s ease-in-out infinite alternate;
  }
  @keyframes btnGlow { to { transform: scale(1.06); } }

  /* Summon buttons: smaller satellites, each themed to its character. Tap to call it on. */
  .callBtn {
    width: 14vmin; height: 14vmin; border-radius: 50%; border: none; cursor: pointer;
    font-family: inherit; font-size: 6vmin; color: #fff; line-height: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-shadow: 0 0.2vh 0 rgba(0,0,0,.3);
    transition: transform .06s ease, box-shadow .06s ease;
  }
  .callBtn small { font-size: 2.1vmin; font-weight: 900; letter-spacing: .05em; margin-top: 0.4vh; }
  .callBtn:active { transform: translateY(0.7vh); }
  #callTrain { background: radial-gradient(circle at 40% 30%, #ff7a6e, #e2231a); box-shadow: 0 0.9vh 0 #a5160f, 0 1vh 2vh rgba(0,0,0,.2); }
  #callPapa  { background: radial-gradient(circle at 40% 30%, #7fb0d6, #5B8DB8); box-shadow: 0 0.9vh 0 #3f6a8f, 0 1vh 2vh rgba(0,0,0,.2); }
  #callMama  { background: radial-gradient(circle at 40% 30%, #e6a0a0, #C96F6F); box-shadow: 0 0.9vh 0 #9c4f4f, 0 1vh 2vh rgba(0,0,0,.2); }

  /* Score: a row of star slots that fill up, so the end of the session is visible coming */
  #score {
    position: absolute; top: 2.5vh; left: 3vw; z-index: 40;
    font-size: 4.6vmin; font-weight: 900; color: #fff; letter-spacing: .2vmin;
    text-shadow: 0 0.4vh 0 #ffb400, 0 0 1vh rgba(0,0,0,.2);
  }
  #score .slot { opacity: .28; filter: grayscale(1); text-shadow: none; }

  /* Floating praise word */
  .pop {
    position: absolute; z-index: 50; font-size: 12vmin; font-weight: 900;
    color: #fff; text-shadow: 0 0.5vh 0 #ff7aa2, 0 0 2vh rgba(0,0,0,.25);
    pointer-events: none; animation: popUp 1s ease-out forwards;
  }
  @keyframes popUp {
    0% { transform: translate(-50%,-50%) scale(.3); opacity: 0; }
    30% { transform: translate(-50%,-60%) scale(1.15); opacity: 1; }
    100% { transform: translate(-50%,-120%) scale(1); opacity: 0; }
  }
  .oops { text-shadow: 0 0.5vh 0 #7aa2ff, 0 0 2vh rgba(0,0,0,.2); }
  /* small name tag that pops off a tapped animal ("COW!") or the bus stop ("WAIT…") */
  .wordPop { font-size: 6vmin; text-shadow: 0 0.4vh 0 #2b3a67, 0 0 1.5vh rgba(0,0,0,.3); }

  /* Confetti */
  .confetti { position: absolute; z-index: 45; font-size: 5vmin; pointer-events: none; animation: fall 1.4s ease-in forwards; }
  @keyframes fall { to { transform: translateY(60vh) rotate(540deg); opacity: 0; } }

  #hint {
    position: absolute; top: 2.5vh; left: 50%; transform: translateX(-50%);
    z-index: 40; font-size: 4.2vmin; font-weight: 900; color: #2b3a67;
    background: rgba(255,255,255,.75); padding: .6vh 3vw; border-radius: 5vh;
    text-align: center; box-shadow: 0 0.6vh 0 rgba(0,0,0,.1);
  }

  /* Pause (grown-up, hold-to-toggle). Sits above the veil so it still works while paused. */
  #pauseBtn {
    position: absolute; top: 2.5vh; right: 2vw; z-index: 62;
    width: 13vmin; height: 13vmin; border-radius: 50%; border: none;
    background: rgba(255,255,255,.7); font-size: 5.6vmin; font-family: inherit; line-height: 1.05;
    box-shadow: 0 0.6vh 0 rgba(0,0,0,.12); cursor: pointer;
  }
  #pauseBtn small { display: block; font-size: 2vmin; font-weight: 900; color: #5a5a66; letter-spacing: .08em; }
  #pauseBtn.holding { transform: scale(.82); background: rgba(255,255,255,.95); }

  /* Pause veil: freezes the scene visually and blocks toddler taps on the game */
  #pauseVeil {
    position: absolute; inset: 0; z-index: 60; display: none;
    background: rgba(43,58,103,.55);
    flex-direction: column; align-items: center; justify-content: center;
    gap: 1.5vh; text-align: center;
  }
  #pauseVeil.show { display: flex; }
  .veilIcon { font-size: 16vmin; line-height: 1; }
  .veilText { font-size: 6.5vmin; font-weight: 900; color: #fff; text-shadow: 0 .5vh 0 rgba(0,0,0,.25); }

  /* Screen-time clock: for the grown-up, so it's small, grey, and counts active play only */
  #timer {
    position: absolute; top: calc(2.5vh + 14.5vmin); right: 2vw; z-index: 40;
    font-size: 3vmin; font-weight: 900; color: rgba(43,58,103,.7);
    background: rgba(255,255,255,.5); padding: .4vh 2.4vw; border-radius: 4vh;
  }
  .byeTime { font-size: 4vmin; font-weight: 900; color: rgba(255,255,255,.85); }

  /* ---- Bye-bye screen: the game ends itself after the last bus ---- */
  #byebye {
    position: absolute; inset: 0; z-index: 90;
    background: linear-gradient(#2b3a67 0%, #7a5ba6 45%, #ff9a62 78%, #ffd23f 100%);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 2.4vh; text-align: center; padding: 4vh 5vw;
  }
  #byebye.show { display: flex; }
  .byeBus { font-size: 24vmin; line-height: 1; animation: busBounce 1.1s ease-in-out infinite; }
  .byeTitle { font-size: 10vmin; font-weight: 900; color: #fff; text-shadow: 0 0.7vh 0 #2b3a67, 0 0 2vh rgba(0,0,0,.25); }
  .byeStars { font-size: 7vmin; font-weight: 900; color: #fff; background: rgba(0,0,0,.18); padding: 1vh 6vw; border-radius: 6vh; }
  #againBtn {
    margin-top: 4vh; font-family: inherit; font-size: 3.6vmin; font-weight: 900;
    color: rgba(255,255,255,.85); background: rgba(255,255,255,.16);
    border: none; border-radius: 5vh; padding: 1.2vh 6vw; cursor: pointer;
  }

  /* ---- Cover / home screen ---- */
  #cover {
    position: absolute; inset: 0; z-index: 100;
    background: linear-gradient(#9dc3d8 0%, #cfe0ea 60%, #8fbf6f 60%, #74a558 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2.4vh; text-align: center; padding: 4vh 5vw;
    transition: opacity .45s ease;
  }
  #cover.hide { opacity: 0; pointer-events: none; }
  .coverBus {
    font-size: 26vmin; line-height: 1;
    filter: drop-shadow(0 1.5vh 0.6vh rgba(0,0,0,.2));
    animation: busBounce 1.1s ease-in-out infinite;
  }
  @keyframes busBounce {
    0%,100% { transform: translateY(0) rotate(-2deg); }
    50%     { transform: translateY(-4vh) rotate(2deg); }
  }
  .coverTitle {
    font-size: 13vmin; font-weight: 900; color: #fff; letter-spacing: .02em;
    text-shadow: 0 0.7vh 0 #ff4d79, 0 0 2vh rgba(0,0,0,.2);
  }
  .coverDeco { font-size: 8vmin; line-height: 1; letter-spacing: .5vw; }
  #startBtn {
    margin-top: 1vh; font-family: inherit; font-size: 9vmin; font-weight: 900; color: #fff;
    padding: 2.4vh 13vw; border: none; border-radius: 12vh; cursor: pointer;
    background: radial-gradient(circle at 40% 30%, #7dffb0, #17c964);
    box-shadow: 0 1.4vh 0 #0e8a44, 0 2vh 3vh rgba(0,0,0,.25);
    text-shadow: 0 0.3vh 0 rgba(0,0,0,.2);
    animation: startPulse 1s ease-in-out infinite alternate;
  }
  #startBtn:active { transform: translateY(1vh); box-shadow: 0 0.4vh 0 #0e8a44; }
  @keyframes startPulse { to { transform: scale(1.06); } }
  .coverSub {
    font-size: 4.4vmin; font-weight: 900; color: #2b3a67;
    background: rgba(255,255,255,.72); padding: 1vh 5vw; border-radius: 6vh;
  }
</style>
</head>
<body>
<div id="game">
  <div class="sun"></div>
  <div class="cloud" style="top:6vh; animation-duration:38s; font-size:11vmin;">☁️</div>
  <div class="cloud" style="top:10vh; animation-duration:52s; animation-delay:-20s; font-size:9vmin;">☁️</div>
  <div class="cloud" style="top:2vh; animation-duration:60s; animation-delay:-40s; font-size:7vmin;">☁️</div>

  <div id="rain"></div>
  <div class="embankment"></div>
  <div class="viaduct"></div>
  <div class="roadFar"></div>
  <div class="verge"></div>
  <div class="road"></div>
  <div class="grass"></div>

  <div id="busStop">
    <svg viewBox="0 0 60 140" xmlns="http://www.w3.org/2000/svg">
      <rect x="27" y="30" width="6" height="106" rx="3" fill="#8a8f98"/>
      <rect x="6" y="4" width="48" height="36" rx="7" fill="#e23744"/>
      <rect x="11" y="9" width="38" height="26" rx="4" fill="#fff"/>
      <!-- little bus glyph on the sign -->
      <rect x="16" y="14" width="28" height="11" rx="3" fill="#84BD00"/>
      <rect x="19" y="16.5" width="6" height="4.5" rx="1.5" fill="#1d1f26"/>
      <rect x="28" y="16.5" width="6" height="4.5" rx="1.5" fill="#1d1f26"/>
      <circle cx="22" cy="27.5" r="2.6" fill="#17181c"/><circle cx="38" cy="27.5" r="2.6" fill="#17181c"/>
    </svg>
  </div>

  <div id="hint">Press only for the 🚌 BUS!</div>
  <div id="score">⭐ 0</div>

  <div id="dock">
    <button id="callTrain" class="callBtn">🚂<small>TRAIN</small></button>
    <button id="tapBtn">TAP<br>for BUS!</button>
    <button id="callPapa" class="callBtn">🧑<small>PAPA</small></button>
    <button id="callMama" class="callBtn">👩<small>MAMA</small></button>
  </div>
  <button id="pauseBtn" title="Grown-up button: press and HOLD to pause/resume">⏸<small>HOLD</small></button>
  <div id="timer">0:00</div>

  <div id="pauseVeil">
    <div class="veilIcon">⏸</div>
    <div class="veilText" id="veilText">Paused</div>
  </div>

  <div id="byebye">
    <div class="byeBus">🚌</div>
    <div class="byeTitle">Bye bye bus!<br>See you later! 👋</div>
    <div class="byeStars" id="byeStars">⭐</div>
    <div class="byeTime" id="byeTime"></div>
    <button id="againBtn">↺ again (grown-ups only)</button>
  </div>

  <div id="cover">
    <div class="coverBus">🚌</div>
    <div class="coverTitle">BAH! Bus Game</div>
    <div class="coverDeco">🚗 🐘 🦁 🐊 🐄 🚌</div>
    <button id="startBtn">▶ PLAY</button>
    <div class="coverSub">Tap the button when you see the 🚌 BUS!</div>
  </div>
</div>

<script>
(function () {
  const game    = document.getElementById('game');
  const btn     = document.getElementById('tapBtn');
  const scoreEl = document.getElementById('score');
  const hint    = document.getElementById('hint');
  const cover   = document.getElementById('cover');
  const startBtn= document.getElementById('startBtn');
  const byebye    = document.getElementById('byebye');
  const byeStars  = document.getElementById('byeStars');
  const againBtn  = document.getElementById('againBtn');
  const busStop   = document.getElementById('busStop');
  const pauseBtn  = document.getElementById('pauseBtn');
  const pauseVeil = document.getElementById('pauseVeil');
  const veilText  = document.getElementById('veilText');
  const timerEl   = document.getElementById('timer');
  const byeTime   = document.getElementById('byeTime');
  const callTrain = document.getElementById('callTrain');
  const callPapa  = document.getElementById('callPapa');
  const callMama  = document.getElementById('callMama');

  let score = 0;                // one star per bus caught (mashing still celebrates, no extra stars)
  let ended = false;            // session over: the game stops itself after starTarget buses
  let busOnScreen = 0;          // how many buses currently crossing
  let busPending = false;       // ding-dong played, bus about to roll in (blocks double-summons)
  let lastBusAt = 0;            // drought protection: force a bus if none for a while (normal mode)
  let paused = false;           // grown-up pause: scene frozen under the veil until resumed
  let pauseStartedAt = 0;
  let playedMs = 0;             // active screen time (pauses excluded); shown in #timer
  const activeActors = [];      // live actors so we can flash the bus

  // Non-bus cast: other vehicles + animals. All cute, none are buses.
  const vehicles = ['🚗','🚕','🚙','🚚','🚜','🏎️','🛵','🚲','🛴','🚑','🚒'];
  // 🚓 pulled out of the generic pool: the police car is a featured spawn with the pee-porr siren.
  // Full-body (side-view) animals so they read as real animals, not cartoon heads.
  const chompAnimals = ['🐊'];                        // "UM" jaw-snap as they walk on (lion uses LION_SVG)
  const plainAnimals = ['🐕','🐈','🐄','🐖','🐎','🐑','🐐','🦆','🐢','🦒','🦛','🦏','🦌','🐓','🐇','🐍','🦖'];

    return `
    <svg viewBox="0 0 120 190" xmlns="http://www.w3.org/2000/svg">
      <defs><clipPath id="head_${id}"><circle cx="60" cy="38" r="33"/></clipPath></defs>

    </svg>`;
  }
  function personOK(who) { return (who === 'papa' ? PAPA_IMG : MAMA_IMG).indexOf('__') !== 0; }
  function peopleReady() { return personOK('papa') || personOK('mama'); }
  function spawnPersonWho(who) {
    if (!personOK(who)) return false;
    spawn('person', { who, svg: who === 'papa' ? personSVG(PAPA_IMG, '#5B8DB8', 'papa')
                                               : personSVG(MAMA_IMG, '#C96F6F', 'mama') });
    return true;
  }
  function spawnPerson() {   // random cameo: mama a bit more often than papa
    const papaOK = personOK('papa'), mamaOK = personOK('mama');
    const who = papaOK && mamaOK ? (Math.random() < 0.4 ? 'papa' : 'mama') : (papaOK ? 'papa' : 'mama');
    spawnPersonWho(who);
  }

  const voiceClips = {};
  for (const k in VOICE_B64) voiceClips[k] = makeClip(VOICE_B64[k]);
  function playVoice(key, delayMs, gain) {
    const c = voiceClips[key];
    if (!c || c.b64.indexOf('__') === 0) return;
    setTimeout(() => { if (!paused && !ended) playClip(c, gain); }, delayMs || 0);
  }

  // Tap-to-name: every non-bus actor has a word; only some have voice clips (keys above).
  const NAMES = {
    '🚗':'car','🚕':'taxi','🚙':'car','🚚':'truck','🚜':'tractor','🏎️':'race car','🛵':'scooter',
    '🚲':'bicycle','🛴':'scooter','🚓':'police car','🚑':'ambulance','🚒':'fire engine',
    '🐕':'dog','🐈':'cat','🐄':'cow','🐖':'pig','🐎':'horse','🐑':'sheep','🐐':'goat','🦆':'duck',
    '🐢':'turtle','🦒':'giraffe','🦛':'hippo','🦏':'rhino','🦌':'deer','🐓':'chicken','🐇':'rabbit',
    '🐍':'snake','🦖':'dinosaur','🐘':'elephant','🐊':'crocodile'
  };

  function loadClip(c) {
    if (c.buffer || c.loading || c.b64.indexOf('__') === 0) return;   // skip if un-injected placeholder
    c.loading = true;
    const ctx = ac();
    const bin = atob(c.b64);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    ctx.decodeAudioData(arr.buffer, b => { c.buffer = b; c.loading = false; }, () => { c.loading = false; });
  }
  function loadAllClips() {
    loadClip(bahClip); loadClip(roarClip); loadClip(umClip); loadClip(trumpetClip);
    for (const k in voiceClips) loadClip(voiceClips[k]);
  }

  function playClip(c, gain) {   // gain (0..1) lets a clip sit UNDER the primary sounds instead of fighting them
    const fire = () => {
      const ctx = ac(); const s = ctx.createBufferSource(); s.buffer = c.buffer;
      if (gain !== undefined && gain !== 1) {
        const g = ctx.createGain(); g.gain.value = gain; s.connect(g); g.connect(ctx.destination);
      } else { s.connect(ctx.destination); }
      s.start();
    };
    if (c.buffer) { fire(); return; }
    loadClip(c);
    setTimeout(() => { if (c.buffer) fire(); }, 140);   // may still be decoding on the very first tap
  }
  function buzz() { // gentle "not a bus" sound, non-scary
    const ctx = ac();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(300, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 0.25);
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.18, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.3);
    o.start(); o.stop(ctx.currentTime + 0.3);
  }
  function dingdong() { // soft two-note doorbell: "a bus is coming!" (plays before every bus)
    const ctx = ac();
    [[659.25, 0], [523.25, 0.28]].forEach(([freq, at]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      o.connect(g); g.connect(ctx.destination);
      const s = ctx.currentTime + at;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.exponentialRampToValueAtTime(0.16, s + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, s + 0.5);
      o.start(s); o.stop(s + 0.55);
    });
  }

  // Lion roar + crocodile "UM" now play Nigel's real recordings (see roarClip / umClip).

  // --- Spawn one actor that drives/walks across ---
  function spawn(kind, spec) {
    spec = spec || {};
    const el = document.createElement('div');
    let emoji, isBus = false, isAnimal = false, isPerson = false, isTrain = false, isPolice = false;

    let animalSound = null, svgMarkup = null, word = null;
    if (kind === 'bus') { isBus = true; svgMarkup = Math.random() < 0.55 ? BUS_SVG : SINGLE_BUS_SVG; }
    else if (kind === 'train') { isTrain = true; svgMarkup = TRAIN_SVG; word = 'train'; }
    else if (kind === 'police') { isPolice = true; emoji = '🚓'; word = 'police'; }
    else if (kind === 'person') { isPerson = true; svgMarkup = spec.svg; word = spec.who; }
    else if (kind === 'animal') {
      isAnimal = true; animalSound = spec.sound || null;
      if (spec.svg) { svgMarkup = spec.svg; word = 'lion'; } else { emoji = spec.emoji; word = NAMES[emoji]; }
    }
    else { emoji = pick(vehicles); word = NAMES[emoji]; }

    // Lane: buses + people + train use fixed lanes; the rest split near/far.
    // Near lane travels right -> left (emoji face left); far lane travels left -> right, flipped.
    const far = (isBus || isPerson || isTrain) ? false
              : (spec.far !== undefined ? spec.far : Math.random() < 0.45);

    // Direction: default is R->L on the near lane, L->R on the far lane. Animals + vehicles
    // occasionally travel the OTHER way for variety (buses stay R->L for the bus stop; a paired
    // mama+baby inherit one shared direction via spec.rightToLeft so they never split up).
    let rightToLeft = !far;
    if (spec.rightToLeft !== undefined) rightToLeft = spec.rightToLeft;
    else if (!isBus && !isPerson && !isTrain && Math.random() < 0.3) rightToLeft = !rightToLeft;

    el.className = 'actor' + (isBus ? ' bus' : '') + (isAnimal ? ' animal' : '')
                 + (animalSound ? ' big' : '') + (isAnimal && spec.baby ? ' baby' : '')
                 + (far ? ' far' : '') + (isPerson ? ' person' : '') + (isTrain ? ' train' : '')
                 + (isPolice ? ' siren' : '');
    if (svgMarkup) el.innerHTML = svgMarkup; else el.textContent = emoji;
    game.appendChild(el);

    const w = el.offsetWidth || 200;
    // Animals go slower than traffic so small hands can tap them (they're the naming targets).
    const dur = isPerson ? (7500 + Math.random()*2000)
              : isTrain ? (6000 + Math.random()*1500)
              : isAnimal ? (6800 + Math.random()*2400) : (4600 + Math.random()*1800);
    // travel R->L: start off the right edge, no flip (emoji already face left).
    // travel L->R: start off the left edge, flip so it faces its direction of travel.
    const startX = rightToLeft ? window.innerWidth + 20 : -w - 20;
    const endX   = rightToLeft ? -w - 20 : window.innerWidth + 20;
    const flip   = rightToLeft ? '' : ' scaleX(-1)';

    const rec = { el, isBus };
    activeActors.push(rec);
    if (isBus) { busOnScreen++; btn.classList.add('busready'); lastBusAt = performance.now(); }

    // Tap the bus itself -> counts as a catch (never punish tapping the actual bus).
    // Tap anything else -> it wiggles, its name pops, and Nigel's label voice plays if recorded.
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault(); e.stopPropagation();
      if (paused || ended) return;
      if (isBus) { playVoice('yesbus', 500); press(); }
      else tapLabel(rec, word);
    });

    // Roaring / chomping animals call out shortly after they walk on (once audio is unlocked).
    // Croc waits ~1s so it's properly on screen before the "UM"; the others call out sooner.
    // spec.quiet = the call already played off-screen (sound-first entrance), don't repeat it.
    if (animalSound && !spec.quiet) {
      setTimeout(() => {
        if (!ended && !paused && activeActors.indexOf(rec) !== -1 && audioCtx && audioCtx.state === 'running') {
          const clip = soundClips[animalSound];
          if (clip) playClip(clip);
        }
      }, animalSound === 'chomp' ? 1600 : 1300);
    }

    // Police car sounds its pee-porr siren shortly after it drives on (once recorded).
    if (isPolice) playVoice('police', 500);

    // Buses pause at the bus stop: a fair, stationary tapping window for small hands.
    const HOLD  = isBus ? 1500 : 0;
    const stopX = isBus ? Math.max(10, window.innerWidth * 0.21 - w * 0.15) : 0;
    const stopFrac = isBus ? (startX - stopX) / (startX - endX) : 0;

    // t0 + step live on the record so the pause veil can freeze and resume every actor.
    rec.t0 = performance.now();
    rec.step = function step(now) {
      const elapsed = now - rec.t0;
      let done = false;
      if (isBus) {
        const dIn = dur * stopFrac, dOut = dur - dIn;
        let x;
        if (elapsed < dIn)             x = startX + (stopX - startX) * (elapsed / dIn);
        else if (elapsed < dIn + HOLD) x = stopX;
        else { const p = Math.min(1, (elapsed - dIn - HOLD) / dOut); x = stopX + (endX - stopX) * p; done = p >= 1; }
        el.style.transform = `translate(${x}px, 0px)`;
        // the caught bus pulls away (visual only; 'hooray' voice is unwired pending Nigel's call)
        if (!rec.wentOff && elapsed >= dIn + HOLD) {
          rec.wentOff = true;
          if (rec.tapped) {
            const r = el.getBoundingClientRect();
            wordPop('BYE! 👋', r.left + r.width / 2, r.top);
          }
        }
      } else {
        const p = Math.min(1, elapsed / dur);
        const x = startX + (endX - startX) * p;
        const bob = (isAnimal || isPerson) ? Math.sin(p * 22) * (window.innerHeight * 0.012) : 0;
        el.style.transform = `translate(${x}px, ${bob}px)` + flip;
        done = p >= 1;
      }
      if (!done) { rec.raf = requestAnimationFrame(rec.step); }
      else { removeActor(rec); }
    };
    rec.raf = requestAnimationFrame(rec.step);
  }

  function removeActor(rec) {
    const i = activeActors.indexOf(rec);
    if (i === -1) return;
    activeActors.splice(i, 1);
    if (rec.isBus) { busOnScreen = Math.max(0, busOnScreen - 1); if (!busOnScreen) btn.classList.remove('busready'); }
    if (rec.raf) cancelAnimationFrame(rec.raf);
    rec.el.remove();
  }

  // --- Scheduler: keep the street busy, buses appear at random ---
  const MAX_ON_SCREEN = 3;
  // Session length = buses to catch before the game ends itself.
  const SESSION_STARS = 10;
  let starTarget = SESSION_STARS;
  const HINT = 'Press only for the 🚌 BUS!';
  const BUS_DROUGHT_MS = 12000; // normal mode: never leave him waiting longer than this for a bus

  // Every bus is announced first: ding-dong + the bus stop sign wiggles, THEN it rolls in.
  function cueThenSpawnBus() {
    if (busPending || ended) return;
    busPending = true;
    dingdong();
    busStop.classList.add('incoming');
    playVoice('wait', 250);
    const sr = busStop.getBoundingClientRect();
    wordPop('WAIT…', sr.left + sr.width / 2, sr.top);
    setTimeout(() => {
      busPending = false;
      busStop.classList.remove('incoming');
      if (!ended && !paused) spawn('bus');   // if the veil dropped mid-cue, the bus is simply dropped
    }, 850);
  }

  // Featured elephant: big, out front, trumpets (once recorded); sometimes brings a baby along.
  // Mama and baby share a lane so the parade reads as one family.
  function spawnElephant() {
    const far = Math.random() < 0.45;
    // one shared direction so mama + baby always walk the same way
    const rightToLeft = far ? (Math.random() < 0.3) : (Math.random() >= 0.3);
    spawn('animal', { emoji: '🐘', sound: 'trumpet', far, rightToLeft });
    if (Math.random() < 0.35) setTimeout(() => { if (!paused) spawn('animal', { emoji: '🐘', baby: true, far, rightToLeft }); }, 700);
  }

  // Sound-first entrance: sometimes the roar/UM comes BEFORE the animal walks on, so Brennan
  // gets a "who's coming?!" prediction beat. Only when the clip is actually decoded.
  function featuredSpawn(spec) {
    // sound-first entrance removed (Nigel: the call was coming before the animal). Always after.
    spawn('animal', spec);
  }

  // Weighted toward the exciting stuff: buses, lions, crocs, elephants; cars/cows fill the gaps.
  // NOTE: two lanes did NOT double the traffic; same cadence + MAX_ON_SCREEN, just distributed.
  function spawnRandom() {
    // Papa/mama cameo (only once their photos are injected): rare, so it stays special.
    if (peopleReady() && Math.random() < 0.06) { spawnPerson(); return; }
    const r = Math.random();
    // One bus at a time in every mode: overlapping buses made "which one did I catch?" messy.
    if (r < 0.20) {
      if (!busOnScreen && !busPending) cueThenSpawnBus(); else spawn('vehicle');          // bus 20%
    }
    else if (r < 0.32) featuredSpawn({ svg: LION_SVG, sound: 'roar' });                    // lion 12%
    else if (r < 0.44) featuredSpawn({ emoji: pick(chompAnimals), sound: 'chomp' });      // croc 12%
    else if (r < 0.55) spawnElephant();                                                   // elephant 11%
    else if (r < 0.63) spawn('police');                                                   // police 8%
    else if (r < 0.83) spawn('animal', { emoji: pick(plainAnimals) });                    // other animals 20%
    else               spawn('vehicle');                                                  // other vehicles 17%
  }
  function scheduleNext() {
    const gap = 1300 + Math.random() * 1600;   // calmer: ~1.3-2.9s between arrivals (more anticipation)
    setTimeout(() => {
      // one timer chain forever; it just idles once the session has ended or while paused
      if (!ended && !paused) {
        // drought protection: random 20% can leave long buslesss stretches a toddler won't sit through
        if (!busOnScreen && !busPending
            && performance.now() - lastBusAt > BUS_DROUGHT_MS) cueThenSpawnBus();
        else if (activeActors.length < MAX_ON_SCREEN) spawnRandom();
      }
      scheduleNext();
    }, gap);
  }

  // MRT on its own viaduct: independent, occasional, one at a time (doesn't eat road traffic).
  function spawnTrain(summoned) {
    if (ended || paused || document.querySelector('.actor.train')) return;
    spawn('train');
    // summoned press always choos; the auto-scheduler only 60% of the time
    if (summoned || Math.random() < 0.6) playVoice('train', 700);
  }
  function scheduleTrain() {
    const gap = 11000 + Math.random() * 9000;   // ~11-20s apart, so a train stays a treat
    setTimeout(() => {
      if (!ended && !paused && started) spawnTrain();
      scheduleTrain();
    }, gap);
  }

  // --- Feedback effects ---
  function popWord(text, cls) {
    const p = document.createElement('div');
    p.className = 'pop ' + (cls || '');
    p.textContent = text;
    p.style.left = '50%'; p.style.top = '42%';
    game.appendChild(p);
    setTimeout(() => p.remove(), 1000);
  }
  // Small name tag at a screen position (tapped animal, bus stop, departing bus)
  function wordPop(text, x, y) {
    const p = document.createElement('div');
    p.className = 'pop wordPop';
    p.textContent = text;
    p.style.left = x + 'px'; p.style.top = y + 'px';
    game.appendChild(p);
    setTimeout(() => p.remove(), 1000);
  }
  // Tap-to-name: wiggle + printed name now; Nigel's "that's a cow" voice once clips are injected
  function tapLabel(rec, word) {
    if (!word) return;
    const now = performance.now();
    if (rec.lastLabelAt && now - rec.lastLabelAt < 800) return;   // no machine-gun labelling
    rec.lastLabelAt = now;
    rec.el.animate(
      [{ rotate: '0deg' }, { rotate: '-7deg' }, { rotate: '7deg' }, { rotate: '0deg' }],
      { duration: 380 }
    );
    const r = rec.el.getBoundingClientRect();
    wordPop(word.toUpperCase() + '!', r.left + r.width / 2, r.top);
    playVoice(word);
  }

  function confetti() {
    const bits = ['🎉','⭐','🌈','✨','🎈','🚌'];
    for (let i = 0; i < 16; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.textContent = bits[(Math.random()*bits.length)|0];
      c.style.left = (10 + Math.random()*80) + 'vw';
      c.style.top = (25 + Math.random()*25) + 'vh';
      c.style.animationDelay = (Math.random()*0.2) + 's';
      game.appendChild(c);
      setTimeout(() => c.remove(), 1700);
    }
  }
  function flashBuses() {
    activeActors.forEach(a => {
      if (a.isBus) {
        a.el.animate(
          [{ filter:'drop-shadow(0 1vh 0.4vh rgba(0,0,0,.18))' },
           { filter:'drop-shadow(0 0 3vmin #17c964) brightness(1.3)' },
           { filter:'drop-shadow(0 1vh 0.4vh rgba(0,0,0,.18))' }],
          { duration: 500, iterations: 2 }
        );
      }
    });
  }

  const praise = ['BUUUSSS!','YAY!','GO GO!','WOOHOO!','NICE!','BEEP BEEP!'];
  const oops   = ['no bus…','wait!','uh-oh','not yet!'];

  // A row of star slots (filled + empty) so he can SEE the session ending coming.
  function renderScore() {
    scoreEl.innerHTML = '';
    for (let i = 0; i < starTarget; i++) {
      const s = document.createElement('span');
      s.textContent = '⭐';
      if (i >= score) s.className = 'slot';
      scoreEl.appendChild(s);
    }
  }

  function press() {
    if (ended || paused) return;
    ac(); loadAllClips(); // unlock + preload audio on first interaction
    if (busOnScreen > 0) {
      // every tap celebrates, but each bus is worth ONE star, so the finish line is real buses caught
      const fresh = activeActors.find(a => a.isBus && !a.tapped);
      if (fresh) {
        fresh.tapped = true; score++; renderScore();
        if (score === starTarget - 1) hint.textContent = 'One more bus! 🚌';
      }
      playClip(bahClip);
      // counting layer: star N pops as a big numeral + Nigel's voice counts (after the BAH)
      // count softly (0.5) so it sits under the BAH / choo-choo instead of competing with them
      if (fresh) { popWord(score + '!'); playVoice('n' + score, 800, 0.5); }
      else popWord(praise[(Math.random()*praise.length)|0]);
      confetti();
      flashBuses();
      btn.animate([{transform:'translateX(-50%) scale(1)'},{transform:'translateX(-50%) scale(1.18)'},{transform:'translateX(-50%) scale(1)'}], {duration:300});
      if (fresh && score >= starTarget) endSession();
    } else {
      buzz();
      popWord(oops[(Math.random()*oops.length)|0], 'oops');
      game.animate([{transform:'translateX(0)'},{transform:'translateX(-1.2vw)'},{transform:'translateX(1.2vw)'},{transform:'translateX(0)'}], {duration:260});
    }
  }

  // --- Session end: the game stops itself so the parent never has to be the bad guy ---
  function endSession() {
    ended = true;
    playVoice('hooray');   // celebrate hitting all the stars, right as it ends
    byeStars.textContent = '⭐ × ' + score;
    byeTime.textContent = 'Screen time: ' + fmtTime(playedMs);
    setTimeout(() => { byebye.classList.add('show'); playVoice('alldone'); }, 1600);   // bye-bye bus + "all done"
  }
  againBtn.addEventListener('click', (e) => {
    e.preventDefault();
    score = 0; renderScore();
    playedMs = 0; timerEl.textContent = '0:00';
    ended = false;
    hint.textContent = HINT;
    lastBusAt = performance.now();
    byebye.classList.remove('show');
    setTimeout(cueThenSpawnBus, 600);
  });

  // --- Grown-up buttons are hold-to-activate: quick toddler taps do nothing. ---
  let coachTimer = null;
  function coach(el2, text) {   // a grown-up tapped instead of holding: tell them, don't leave them mashing
    hint.textContent = text;
    el2.animate([{transform:'scale(1)'},{transform:'scale(1.18)'},{transform:'scale(1)'}], {duration:320});
    clearTimeout(coachTimer);
    coachTimer = setTimeout(() => { if (!ended) hint.textContent = HINT; }, 2500);
  }
  function bindHold(el2, fn, coachText) {
    let t = null, t0h = 0;
    el2.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (t) return;
      t0h = performance.now();
      el2.classList.add('holding');
      t = setTimeout(() => { t = null; el2.classList.remove('holding'); fn(); }, 450);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el2.addEventListener(ev, () => {
      if (t) {
        clearTimeout(t); t = null;
        if (performance.now() - t0h > 60) coach(el2, coachText);   // a real press that let go too early
      }
      el2.classList.remove('holding');
    }));
  }
  bindHold(pauseBtn, () => setPaused(!paused), 'Grown-up: press and HOLD the ⏸ button');

  // --- Summon buttons (train / papa / mama): a tap-to-call soundboard, NOT bus catches. ---
  // Always positive: they bring the character on and say its name. The bus stays the one game.
  function popFromBtn(el2, text) {
    const r = el2.getBoundingClientRect();
    wordPop(text, r.left + r.width / 2, r.top);
  }
  function callSummon(kind) {
    if (!started || ended || paused) return;
    ac(); loadAllClips();
    if (kind === 'train') { spawnTrain(true); popFromBtn(callTrain, 'TRAIN!'); }
    else {
      if (!spawnPersonWho(kind)) return;                 // photo not injected -> do nothing
      playVoice(kind, 250);
      popFromBtn(kind === 'papa' ? callPapa : callMama, kind.toUpperCase() + '!');
    }
  }
  function bindTap(el2, fn) {
    el2.addEventListener('click', (e) => { e.preventDefault(); fn(); });
    el2.addEventListener('touchstart', (e) => { e.preventDefault(); fn(); }, {passive:false});
  }
  bindTap(callTrain, () => callSummon('train'));
  bindTap(callPapa,  () => callSummon('papa'));
  bindTap(callMama,  () => callSummon('mama'));

  // --- Pause: freeze every actor mid-scene; the veil blocks toddler taps until resume ---
  function setPaused(p) {
    if (!started || ended || paused === p) return;
    paused = p;
    if (p) {
      pauseStartedAt = performance.now();
      activeActors.forEach(r => { if (r.raf) cancelAnimationFrame(r.raf); });
      busPending = false; busStop.classList.remove('incoming');   // drop any in-flight cue
      veilText.textContent = 'Paused';
      pauseVeil.classList.add('show');
      pauseBtn.innerHTML = '▶<small>HOLD</small>';
    } else {
      const dt = performance.now() - pauseStartedAt;
      activeActors.forEach(r => { r.t0 += dt; r.raf = requestAnimationFrame(r.step); });
      lastBusAt += dt;   // don't let the drought clock tick during a pause
      pauseVeil.classList.remove('show');
      pauseBtn.innerHTML = '⏸<small>HOLD</small>';
    }
  }

  // --- Screen-time clock: counts active play only (pauses excluded) ---
  function fmtTime(ms) {
    const s = Math.round(ms / 1000);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  setInterval(() => {
    if (started && !ended && !paused) {
      playedMs += 1000;
      timerEl.textContent = fmtTime(playedMs);
    }
  }, 1000);

  // Keep the iPad awake during play, and revive audio after app-switching/locking.
  let wakeLock = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      if (started) keepAwake();
      if (audioCtx && audioCtx.state !== 'running') audioCtx.resume();
    }
  });

  // Populate the rain layer with many independently-timed falling streaks (near + far depth).
  function makeRain() {
    const rain = document.getElementById('rain');
    if (rain.childElementCount) return;                 // build once per session
    for (let i = 0; i < 60; i++) {
      const d = document.createElement('div');
      const far = Math.random() < 0.45;
      d.className = 'drop' + (far ? ' far' : '');
      d.style.left = (Math.random() * 104 - 2) + 'vw';
      d.style.height = (far ? (2.4 + Math.random() * 2) : (4 + Math.random() * 3)) + 'vh';
      const dur = far ? (0.9 + Math.random() * 0.45) : (0.55 + Math.random() * 0.3);
      d.style.animationDuration = dur.toFixed(2) + 's';
      d.style.animationDelay = (-Math.random() * dur).toFixed(2) + 's';   // stagger so it starts mid-fall
      d.style.opacity = (0.5 + Math.random() * 0.5).toFixed(2);
      rain.appendChild(d);
    }
  }

  // --- Start screen -> game ---
  let started = false;
  function startGame() {
    if (started) return;
    started = true;
    starTarget = SESSION_STARS;
    // Random sky this session (weighted to noon), plus occasional very-light rain.
    game.classList.add(['noon','noon','morning','evening'][(Math.random()*4)|0]);
    if (Math.random() < 0.3) { document.body.classList.add('rain'); makeRain(); }
    ac(); loadAllClips();                  // PLAY tap unlocks + preloads every sound
    keepAwake();
    cover.classList.add('hide');
    hint.textContent = HINT;
    renderScore();
    lastBusAt = performance.now();
    setTimeout(cueThenSpawnBus, 500);    // guarantee an early bus so he gets a quick win
    scheduleNext();
    scheduleTrain();
    setTimeout(spawnTrain, 3500);   // an early MRT so Brennan sees it soon after starting
  }
  startBtn.addEventListener('click', (e) => { e.preventDefault(); startGame(); });
  startBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startGame(); }, {passive:false});

  // --- Inputs: tap / click / spacebar ---
  btn.addEventListener('click', (e) => { e.preventDefault(); press(); });
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); press(); }, {passive:false});
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (!started) startGame(); else press();   // space starts the game, then taps for the bus
    }
    if ((e.key === 'p' || e.key === 'P') && started && !ended) setPaused(!paused);   // keyboard pause
  });
})();
</script>
</body>
</html>
